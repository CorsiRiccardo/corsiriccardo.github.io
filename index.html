<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Software developer specialising in game systems and backend tools. View my projects and experience.">

  <!-- Open Graph — all values are exact; og:image MUST be absolute URL -->
  <meta property="og:title" content="Riccardo Corsi — Software Developer">
  <meta property="og:description" content="Software developer specialising in game systems and backend tools. View my projects and experience.">
  <meta property="og:image" content="https://corsiriccardo.github.io/assets/og-image.png">
  <meta property="og:url" content="https://corsiriccardo.github.io">
  <meta property="og:type" content="website">

  <title>Riccardo Corsi — Software Developer</title>

  <!-- Font preloads — MUST appear before CSS links to prevent double fetch.
       crossorigin attribute is required even for same-origin fonts (browser CORS behavior). -->
  <link rel="preload" href="assets/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/lora-400.woff2" as="font" type="font/woff2" crossorigin>

  <!-- CSS — linked in @layer declaration order from tokens.css -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Favicons — SVG for modern browsers, ICO fallback for old browsers -->
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Skip link: first element in body for keyboard navigation accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="#hero" class="nav-link">Home</a></li>
        <li><a href="#projects" class="nav-link">Projects</a></li>
        <li><a href="#about" class="nav-link">About</a></li>
        <li><a href="#timeline" class="nav-link">Experience</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
      <button class="nav__hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect y="4" width="24" height="2" fill="currentColor"/>
          <rect y="11" width="24" height="2" fill="currentColor"/>
          <rect y="18" width="24" height="2" fill="currentColor"/>
        </svg>
      </button>
    </nav>
  </header>

  <main id="main-content">
    <section id="hero" aria-label="Introduction">
      <!-- Phase 2 content: hero name, title, tagline, CTA -->
    </section>

    <section id="projects" aria-label="Projects">
      <!-- Phase 2 content: project cards loaded from data/projects.json -->
    </section>

    <section id="about" aria-label="About">
      <!-- Phase 2 content: about copy, stack -->
    </section>

    <section id="timeline" aria-label="Work experience">
      <!-- Phase 2 content: timeline entries -->
    </section>

    <section id="contact" aria-label="Contact">
      <!-- Phase 2 content: email and LinkedIn CTAs -->
    </section>
  </main>

  <footer>
    <!-- Phase 2 content: footer copy -->
  </footer>

  <!-- nav.js must be type="module" — uses ES module syntax (import/export not used here
       but module semantics apply: deferred execution, strict mode, no global leak) -->
  <script type="module" src="js/nav.js"></script>
</body>
</html>
